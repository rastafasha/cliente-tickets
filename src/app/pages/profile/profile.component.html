<app-header></app-header>
<section class="user container">
  <div class="container-fluid">
     <div class="col-xs-12 pt-5">
          <app-backButtn [pageTitle]="pageTitle"></app-backButtn>
          <app-loading *ngIf="isLoading" [loadingTitle]="loadingTitle"></app-loading>
          <div class=" itemFav shadow" *ngIf="!isLoading">
            <div class="fototext">
              <img [src]="(profile.avatar || '')  | imagenPipe: 'clients' " alt="">
              <div class="div1">
                <p>{{'Username'|translate}}: {{profile.name}}</p>
                <p *ngIf="profile">{{profile.name}} {{profile.surname}}</p>
                <p>{{user.email}}</p>
                <p>{{profile.pais.code}} | {{profile.pais.title}}</p>
                <!-- <p>{{user.roles}}</p> -->
                <!-- <p *ngIf="profile">{{profile.status}}</p> -->
                <span class="badge  bg-primary" *ngIf="profile.status === 'PENDING'"> {{'Pending'|translate}}</span>
                <span class="badge bg-success" *ngIf="profile.status === 'ACTIVE'">{{'Verified'|translate}}</span>
                <span class="badge bg-danger" *ngIf="profile.status === 'INACTIVE'">{{'For Review'|translate}}</span>
                
    
              </div>
            </div>
           
            <div class="admin-services">
              <a [routerLink]="['/profile/edit', user.id]">
                <div class="option-admin">
                  <i class="fa fa-user"></i>
                  <p>{{'Edit Profile'|translate}}</p>
                </div>
              </a>
              <!-- <a [routerLink]="['/profile/edit', user.id]">
                <div class="option-admin">
                  <i class="fa fa-envelope"></i>
                  <p>{{'Notificaciones'|translate}}</p>
                </div>
              </a> -->
            
             
              <a (click)="logout()">
                <div class="option-admin">
                  <i class="fa fa-power-off"></i>
                  <p>{{'Logout'|translate}}</p>
                </div>
              </a>
            </div>
          </div>
          
  
          <!--banner publicidad-->
          <!-- <div class="banner-rectangular">
            <img src="https://picsum.photos/seed/1920/120" alt="" />
             
          </div> -->
          <!--banner publicidad-->
        </div>
  
   </div>
</section>
<app-menu-footer></app-menu-footer>
