<app-header></app-header>
<div class="user container">
    <div class="container-fluid ">
        <app-backButtn [pageTitle]="pageTitle"></app-backButtn>
    
        <div class="tab-content-set">
            <ul class="nav">
                <li>
                    <a href="#" onclick="return false;" [ngClass]="{'active': option_selectedd == 1}"
                        (click)="optionSelected(1)">Compras</a>
                </li>
                <li>
                    <a href="#" onclick="return false;" [ngClass]="{'active': option_selectedd == 2}"
                        (click)="optionSelected(2)">Eventos</a>
                </li>
                <!-- <li>
                    <a href="#" onclick="return false;" [ngClass]="{'active': option_selectedd == 3}"
                        (click)="optionSelected(3)">Calendario</a>
                </li> -->
            </ul>
        </div>
         <div class="row" *ngIf="option_selectedd == 1">
            <div class="col-xs-12">
                    <!-- buscador -->
                    <form class="form-horizontal">
                        <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">
                            <div class="input-group">
                                <input type="search" name="search" type="text" class="form-control col-xs-12"
                                    placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                                    class="form-control border-0 bg-light">
                                <div class="input-group-append">
                                    <button id="button-addon1" type="submit" class="btn btn-link text-primary circle"
                                        (click)="search()" name="submit" data-toggle="tooltip" title="mostrar todos"><i
                                            class="fa fa-search"></i></button>
                                    <a href="javascript:;" (click)="PageSize()"
                                        class="btn btn-primary doctor-refresh ms-2 circle"><i class="fa fa-refresh"></i></a>
                                </div>
                            </div>
                        </div>
                    </form>
                    <!-- buscador -->
                </div>
            <app-loading *ngIf="isLoading"></app-loading>
            <div class="card recent-sales overflow-auto border-radio" *ngIf="!isLoading">
                <div class="card-body" >
                    <table class="table table-borderless datatable table-striped">
                        <thead>
                            <tr>
                                <th scope="col">Imagen</th>
                                <th scope="col">Referencia</th>
                                <th scope="col">Evento</th>
                                <th scope="col">Status Deuda</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let pago of payments ">
                                <td>
                                    <img [src]="pago.avatar| imagenPipe: 'payments' " class="imagecircle shadow" alt="">
                                </td>
                                <th scope="row"><a [routerLink]="['/payment-detail', pago.id]">{{pago.referencia}}</a>
                                </th>
    
                                <th scope="row"><a [routerLink]="['/event/', pago.event_id]">{{pago.event?.name}}</a>
                                </th>
                                
                                <td>
                                    <span class="badge bg-success" *ngIf="pago.status_deuda !== 'DEUDA'">Pagado</span>
                                    <span class="badge bg-danger" *ngIf="pago.status_deuda === 'DEUDA'">Deuda</span>
                                </td>
    
                                <td>
                                    <span class="badge bg-success" *ngIf="pago.status === 'APPROVED'">
                                        <i class="fa fa-check-circle" ></i>
                                    </span>
                                    <span class="badge bg-primary" *ngIf="pago.status === 'PENDING'">
                                        <i class="fa fa-coffee"></i>
                                    </span>
                                    <span class="badge bg-danger" *ngIf="pago.status === 'REJECTED'">
                                        <i class="fa fa-close"></i>
                                    </span>
                                </td>
                            </tr>
    
    
                        </tbody>
                    </table>
                </div>
    
            </div>
         </div>
    
    
         <div class="row" *ngIf="option_selectedd == 2">
            <app-eventsuser [userprofile]="userprofile"></app-eventsuser>
         </div>
    </div>

</div>
<app-menu-footer></app-menu-footer>
