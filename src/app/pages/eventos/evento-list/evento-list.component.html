<app-header></app-header>
<div class="user container">
    <div class="row">
        <app-backButtn [pageTitle]="pageTitle"></app-backButtn>
        <app-category-bar></app-category-bar>
            <div class="col-xs-12">
                <!-- buscador -->
                <form class="form-horizontal">
                    <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">
                        <div class="input-group">
                            <input type="search" name="search" type="text" class="form-control col-xs-12"
                                placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                                class="form-control border-0 bg-light">
                            <div class="input-group-append">
                                <button id="button-addon1" type="submit" class="btn btn-link text-primary circle"
                                    (click)="search()" name="submit" data-toggle="tooltip" title="mostrar todos"><i
                                        class="fa fa-search"></i></button>
                                <a href="javascript:;" (click)="PageSize()"
                                    class="btn btn-primary doctor-refresh ms-2 circle"><i class="fa fa-refresh"></i></a>
                            </div>
                        </div>
                    </div>
                </form>
                <!-- buscador -->
            </div>
        <app-loading *ngIf="isLoading"></app-loading>
        <div class="card recent-sales overflow-auto border-radio" *ngIf="!isLoading">
    
            <div class="card-body">
    
                <table class="table table-borderless datatable table-striped">
                    <thead>
                        <tr>
                            <!-- <th>ID</th> -->
                            <!-- <th>Imagen</th>
                            <th>Nombre</th> -->
                             <!-- <th>Inicio</th> -->

                            <!-- <th>Option</th> -->
                            <!-- <th class="text-nowrap">Acciones</th> -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr
                            *ngFor="let evento of eventos  ; let i = index;">
    
                            <td>
                                <!-- <a data-bs-toggle="modal" data-bs-target="#eventoModal" (click)="openPaymentsModal(evento)"> -->
                                <a [routerLink]="['/event/', evento.id]">
    
                                    <img [src]="evento.avatar| imagenPipe: 'events' "  class="imagecircle shadow" alt="">
                                </a>
                            </td>
                            <td><a [routerLink]="['/event/', evento.id]">{{evento.name}} </a></td>
                             <!-- <td>{{evento.fecha_inicio|date}} </td> -->
                            <!--<td>{{evento.fecha_fin|date}} </td> -->

                                 <span class="badge bg-success" *ngIf="evento.status === 'PUBLISHED'">Publicado</span>
                                <span class="badge bg-danger" *ngIf="evento.status === 'INACTIVE'">Inactivo</span>
                                <span class="badge bg-primary" *ngIf="evento.status === 'RETIRED'">Retirado</span>
                                <span class="badge bg-warning" *ngIf="evento.status === 'FINISHED'">Finalizado</span>    
                            </td> -->

                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#eventoModal" (click)="openPaymentsModal(evento)">
                                    <i class="fa fa-eye"></i>
                                </button>
                                <button type="button" class="btn btn-danger"  (click)="eliminarUser(evento)">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td> -->

                            <!-- Modal -->
                        </tr>
                    </tbody>
    
                </table>
    
    
            </div>
    
        </div>
