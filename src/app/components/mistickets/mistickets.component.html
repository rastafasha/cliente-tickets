<app-loading *ngIf="isLoading"></app-loading>
<div *ngIf="!isLoading">
    <div *ngIf="!isTtickets">
        <p class="text-center p-3">
            Aún no posees tickets recibidos
        </p>
    </div>
    <div *ngIf="!isTtickets">
        <!-- tickets recibidos -->
        <!-- <h5>{{title}}</h5> -->
        <div class="col-xs-12 " *ngFor="let ticket of ticketsShared ; let i = index">
            <div class="ticket-card">
                <div class="image">
                    <img [src]="ticket.qr_code " alt="Ticket QR" />
                </div>
                <div class="contenido">
                    <h3>{{ ticket.referencia }}</h3>
                    <p>Evento: <a [routerLink]="['/event/', ticket.event_id]">{{ ticket.event?.name | slice:0:15}}...</a></p>
                    <p>Status: </p>
                    <span class="badge bg-success" *ngIf="ticket.status === 'SHARED'">
                        <i class="fa fa-share"></i> Compartido
                    </span>
                    <span class="badge bg-success" *ngIf="ticket.status === 'ACTIVE'">
                        <i class="fas fa-check"></i> Activo
                    </span>
                    <span class="badge bg-success" *ngIf="ticket.status === 'SHAREDACTIVE'">
                        <i class="fa fa-check-circle"></i> Compartido Activado
                    </span>
                    <span class="badge bg-primary" *ngIf="ticket.status === 'INACTIVE'">
                        <i class="fas fa-coffee"></i> pendiente por activar o usar
                    </span>
                    <span class="badge bg-danger" *ngIf="ticket.status === 'EXPIRED'">
                        <i class="fas fa-close"></i> Expirado
                    </span>

                </div>
                <div class="actions">
                    <!-- <a (click)="abrirModalInfo()" class="btn btn-success">
            <i class="fa fa-share"></i>
        </a> -->
                    <a (click)="aceptarTicketShared(ticket)" *ngIf="ticket.status !== 'ACTIVE'"
                        class="btn btn-outline-success">
                        <i class="fa fa-check-circle-o"></i>
                    </a>
                    <a [routerLink]="['/ticket-detail', ticket.id]" class="btn btn-outline-primary">
                        <i class="fa fa-eye"></i>
                    </a>

                </div>
            </div>


        </div>

    </div>


</div>
