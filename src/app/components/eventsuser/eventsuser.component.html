<div class="row">
        <div class="col-xs-12">
            <!-- buscador -->
            <form class="form-horizontal">
                <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">
                    <div class="input-group">
                        <input type="search" name="search" type="text" class="form-control col-xs-12"
                            placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                            class="form-control border-0 bg-light">
                        <div class="input-group-append">
                            <button id="button-addon1" type="submit" class="btn btn-link text-primary circle"
                                (click)="search()" name="submit" data-toggle="tooltip" title="mostrar todos"><i
                                    class="fa fa-search"></i></button>
                            <a href="javascript:;" (click)="PageSize()"
                                class="btn btn-primary doctor-refresh ms-2 circle"><i class="fa fa-refresh"></i></a>
                        </div>
                    </div>
                </div>
            </form>
            <!-- buscador -->
        </div>
    </div>
    <app-loading *ngIf="isLoading"></app-loading>
    <div class="card recent-sales overflow-auto border-radio" *ngIf="!isLoading">
        <div class="card-body" >
            <table class="table table-borderless datatable table-striped">
                <thead>
                    <tr>
                        <th scope="col">Imagen</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let evento of events ">
                        <td>
                            <img [src]="evento.avatar| imagenPipe: 'events' " class="imagecircle shadow" style="width: 45px; height: 45px;" alt="">
                        </td>
                        <td><a [routerLink]="['/event/', evento.id]">{{evento.name}} </a></td>
                        
                        <td>
                            {{evento.fecha_inicio|date}}
                        </td>

                        <td>
                             <span class="badge bg-success" *ngIf="evento.status === 'ACTIVE'">Activo</span>
                            <span class="badge bg-danger" *ngIf="evento.status === 'INACTIVE'">Inactivo</span>
                            <span class="badge bg-primary" *ngIf="evento.status === 'RETIRED'">Retirado</span>
                            <span class="badge bg-warning" *ngIf="evento.status === 'FINISHED'">Finalizado</span>    
                        </td>
                       
                    </tr>


                </tbody>
            </table>
        </div>

    </div>
