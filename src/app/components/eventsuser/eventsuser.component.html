<div class="row">
        <div class="col-xs-12">
            <!-- buscador -->
            <form class="form-horizontal">
                <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">
                    <div class="input-group">
                        <input type="search" name="search" type="text" class="form-control col-xs-12"
                            placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                            class="form-control border-0 bg-light">
                        <div class="input-group-append">
                            <button id="button-addon1" type="submit" class="btn btn-link text-primary circle"
                                (click)="search()" name="submit" data-toggle="tooltip" title="mostrar todos"><i
                                    class="fa fa-search"></i></button>
                            <a href="javascript:;" (click)="PageSize()"
                                class="btn btn-primary doctor-refresh ms-2 circle"><i class="fa fa-refresh"></i></a>
                        </div>
                    </div>
                </div>
            </form>
            <!-- buscador -->
        </div>
    </div>
    <app-loading *ngIf="isLoading"></app-loading>
    <div class="card recent-sales overflow-auto border-radio" *ngIf="!isLoading">
        <div class="card-body" >
            

            @for (evento of events; track evento.id) {
                    <div class="card border-0 shadow-sm mb-3 border-start border-4 " >
                        <div class="card-body p-3">
                            <!-- Fila Superior: Fecha y Estatus -->
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="mb-0 fw-bold text-secondary text-uppercase" style="font-size: 0.75rem;">
                                        Fecha:{{evento.fecha_inicio | date:'dd/MM/yyyy'}}
                                    </h6>
                                </div>
                                <img [src]="evento.avatar| imagenPipe: 'events' " class="imagecircle shadow" style="width: 45px; height: 45px;" alt="">

                            </div>

                            <!-- Fila Media: Monto -->
                            <div class="mb-2">
                                <p class="mb-0 h4 fw-bold text-dark">
                                    {{evento.name}}
                                </p>
                                <p class="mb-0 h5 fw-bold text-dark">
                                    Tickets: {{evento.ticketcount ? evento.ticketcount : 1}}
                                </p>
                                <small class="text-muted d-block">Asistencia: {{asistencia}}</small>
                            </div>

                            <!-- Fila Inferior: Botón de Acción -->
                            <div class="d-flex justify-content-end  border-top border-light">
                                <button class="btn btn-sm btn-outline-primary rounded-pill px-4 fw-bold"
                                    style="font-size: 0.8rem;" (click)="irAEvento(evento)">
                                    <i class="fas fa-receipt me-1"></i> Ver Evento
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    } @empty {
                    <p class="text-center text-muted">No hay eventos registrados.</p>
                    }
        </div>

    </div>
